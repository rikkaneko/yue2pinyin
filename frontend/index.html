<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>粵語發音轉換</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script defer src="./config.js"></script>
    <script defer type="module" src="./app.js"></script>
  </head>
  <body class="bg-body">
    <div class="app-shell d-flex min-vh-100">
      <aside class="sidebar bg-body-tertiary border-end p-3" id="sidebar" aria-label="功能選單">
        <div class="brand d-flex align-items-center gap-2 mb-5 px-2 pt-2">
          <span class="brand-mark bg-primary text-white rounded-3 fw-bold d-grid" aria-hidden="true">粵</span>
          <span><strong class="d-block">粵語發音轉換</strong><small class="d-block text-body-secondary">Yue2Pinyin</small></span>
        </div>
        <nav class="nav nav-pills flex-column gap-2" aria-label="模組">
          <button class="nav-link active" type="button" data-view="pronunciation" aria-current="page">粵語轉近似拼音</button>
          <button class="nav-link" type="button" data-view="flashcard">粵語詞語卡</button>
        </nav>
        <p class="text-body-secondary small px-3 mt-4">聽廣東話，睇粵拼，用熟悉嘅拼音練發音。</p>
      </aside>

      <main class="main-content flex-grow-1">
        <header class="topbar bg-body border-bottom d-flex align-items-center justify-content-between gap-3 px-4">
          <button id="sidebar-toggle" class="btn btn-outline-secondary d-lg-none" type="button" aria-label="開啟功能選單" aria-controls="sidebar" aria-expanded="false">☰</button>
          <span class="small text-body-secondary text-uppercase me-auto">Yue2Pinyin</span>
          <span class="badge text-bg-primary">粵語 · 普通話</span>
        </header>

        <section id="pronunciation-view" class="view-panel container-xl py-4 py-md-5 px-4" aria-labelledby="pronunciation-title">
          <div class="mb-4">
            <p class="small fw-bold text-primary mb-2">PRONUNCIATION LAB</p>
            <h1 id="pronunciation-title" class="display-6 fw-bold">讀懂每個粵語字詞</h1>
            <p class="text-body-secondary">輸入廣東話，睇粵拼、近似普通話拼音同發音提示。</p>
          </div>
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <label class="form-label fw-semibold" for="cantonese-input">廣東話文字</label>
              <textarea id="cantonese-input" class="form-control" rows="4" maxlength="2000"></textarea>
              <div class="input-actions d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-3 mt-3">
                <span class="form-text">支援字詞、句子及標點符號</span>
                <div class="d-flex gap-2">
                  <button id="speak-input" class="btn btn-outline-primary" type="button" disabled>聽全文</button>
                  <button id="analyze-button" class="btn btn-primary" type="button">分析發音</button>
                </div>
              </div>
            </div>
          </div>
          <div id="pronunciation-status" class="status-message mt-3" role="status" aria-live="polite"></div>
          <div id="pronunciation-result" class="mt-3" aria-live="polite"></div>
        </section>

        <section id="flashcard-view" class="view-panel container-xl py-4 py-md-5 px-4" aria-labelledby="flashcard-title" hidden>
          <div class="mb-4">
            <p class="small fw-bold text-primary mb-2">WORD DISCOVERY</p>
            <h1 id="flashcard-title" class="display-6 fw-bold">每日一張粵語詞語卡</h1>
            <p class="text-body-secondary">認識詞義、例句同讀音，再撳播放練習聆聽。</p>
          </div>
          <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-3 mb-3">
            <a href="https://words.hk/" target="_blank"> 
              <span class="badge text-bg-secondary p-2">來自 words.hk 詞庫</span>
            </a>
            <button id="next-word" class="btn btn-primary" type="button">抽一張詞語卡</button>
          </div>
          <div id="flashcard-status" class="status-message" role="status" aria-live="polite"></div>
          <div id="flashcard-result" aria-live="polite"></div>
        </section>
      </main>
    </div>
    <footer class="site-footer bg-body border-top text-body-secondary text-start small">
      &copy; Copyright Joe Ma &lt;<a href="mailto:rikkaneko23@gmail.com">rikkaneko23@gmail.com</a>&gt; · <a href="https://github.com/rikkaneko/yue2pinyin">yue2pinyin</a>
    </footer>
    <dialog id="hint-dialog" class="hint-dialog border-0 rounded-3 shadow p-0" aria-labelledby="hint-dialog-title">
      <div class="p-4">
        <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
          <h2 id="hint-dialog-title" class="h5 mb-0"></h2>
          <button id="hint-dialog-close" class="btn-close" type="button" aria-label="關閉發音提示"></button>
        </div>
        <div id="hint-dialog-content"></div>
      </div>
    </dialog>
    <div id="active-hint-box" class="word-hint-box bg-body border rounded-3 shadow-sm p-2 text-start" role="note" hidden></div>
  </body>
</html>
